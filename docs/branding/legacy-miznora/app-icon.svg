<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Miznora app icon</title>
  <desc id="desc">An emerald serif M entwined with a champagne gold ribbon and a woman's profile, beneath a luminous four-point star. An ivory tile is enclosed by a polished gold frame.</desc>
